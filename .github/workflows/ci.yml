name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main, master]
    paths-ignore: ['**.md', 'docs/**']

jobs:
  typescript:
    name: TypeScript Compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:ts
      - run: npm test:ts

  cpp-wasm:
    name: C++ → WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.50
      - run: emcc -v
      - run: npm run build:wasm

  cpp-native:
    name: C++ → Native
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build native
        run: |
          g++ -std=c++20 -O3 src/runtime/cpp/*.cpp -o luazi-native
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luazi-native-${{ matrix.os }}
          path: luazi-native*

  csharp:
    name: C# Runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore Luazi.sln
      - run: dotnet build Luazi.sln -c Release
      - run: dotnet test
